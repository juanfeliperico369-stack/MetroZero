name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # para adjuntar el APK a la release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE: ${{ github.workspace }}/android/gradlew # Gradle fijado por el wrapper (8.14.3)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6 # caché de Gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Si dist/ no está en el repo, se construye el juego. Ajusta el comando si cambia.
      - name: Construir el juego (si falta dist/index.html)
        run: |
          if [ ! -f dist/index.html ]; then
            if [ -f package-lock.json ]; then npm ci; fi
            if [ -f tools/build.mjs ]; then
              node tools/build.mjs
            else
              echo "::error::Falta dist/index.html y no existe tools/build.mjs"
              exit 1
            fi
          fi

      - name: Construir APK
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            props="$(sed -n 's/^elmetro.versionName=//p' android/gradle.properties)"
            [ "$ver" = "$props" ] || echo "::warning::El tag ($ver) no coincide con elmetro.versionName ($props); se usa el del tag. ¿Subiste también versionCode?"
            args+=("-Pelmetro.versionName=$ver")
          fi
          tools/apk.sh "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: el-metro-apk
          path: dist/el-metro.apk
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "El Metro $tag" --generate-notes
          gh release upload "$tag" dist/el-metro.apk --clobber
