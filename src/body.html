<body>
<div id="app">
 <section class="scr" id="cover">
  <header class="hero">
   <canvas class="cart" id="cvArt" width="320" height="200" aria-hidden="true"></canvas>
   <div class="hero-top"><span class="estado" id="cvClock">Servicio de 4:30 a 23:00</span><button class="ib" id="bCfg" aria-label="Ajustes">⚙</button></div>
   <div class="hero-tx"><h1 class="titulo">El Metro</h1><p class="lema">Medellín y el Valle de Aburrá en metro, tranvía, cable y bus</p></div>
  </header>
  <nav class="linea" aria-label="Menú principal">
   <span class="tren" id="cvTren" aria-hidden="true"></span>
   <button class="parada principal" id="bPlay" style="--c:var(--lA)"><i></i><span><b>Jugar</b><small>Ciudad Libre y todos los modos</small></span></button>
   <button class="parada" id="bStory" style="--c:var(--lH)"><i></i><span><b>La última vuelta</b><small>La historia de Rosalba, el último viaje antes de jubilarse</small></span></button>
   <button class="parada" id="bGuia" style="--c:var(--lT)"><i></i><span><b>Aprende a usar el Metro</b><small>Cívica, líneas, transbordos y Cultura Metro</small></span></button>
   <button class="parada" id="bMulti" style="--c:var(--lM)"><i></i><span><b>Jugar juntos</b><small>En el mismo celular o en la misma red Wi‑Fi</small></span></button>
  </nav>
 </section>

 <section class="scr" id="menu">
  <div class="band"><button class="ib" id="mBack" aria-label="Volver" style="border-left:0;border-right:3px solid var(--negro)">←</button><div class="bt">El Metro</div><div class="sp"></div><div class="tag" id="mWallet">0 pasajes</div></div>
  <div class="scroll"><div class="wrap">
   <div class="cabeza"><h1>Elige tu viaje</h1><p class="m" id="mGreet">Buenos días</p></div>
   <div id="mVida"></div>
   <div class="modes" id="mList"></div>
   <div class="franja" style="margin:22px 0 12px"></div>
   <div class="row"><button class="btn sm gh" id="mBot">Ver demostración</button><button class="btn sm gh" id="mExport">Exportar partidas</button><button class="btn sm gh" id="mImport">Importar partidas</button><button class="btn sm gh" id="mCred">Créditos</button></div>
  </div></div>
 </section>

 <section class="scr" id="levels">
  <div class="band"><button class="ib" id="lBack" aria-label="Volver" style="border-left:0;border-right:3px solid var(--negro)">←</button><div class="bt" id="lTitle">Niveles</div><div class="sp"></div><div class="tag" id="lStars">★ 0</div></div>
  <div class="scroll"><div class="wrap" id="lBody"></div></div>
 </section>

 <section class="scr" id="game">
  <canvas id="gcv"></canvas>
  <div id="ghud"><div class="gt"><b id="gTitle">—</b><small id="gSub">—</small></div><div class="chips" id="gChips"></div><button class="ib" id="gPause" aria-label="Pausa">❚❚</button></div>
  <div id="gmsg"></div>
  <div id="gctl"></div>
 </section>

 <section class="scr" id="story">
  <canvas id="stCv" width="320" height="180"></canvas>
  <div class="sbox"><div class="film" id="stText"></div><div class="sbt"><button class="btn sm gh" id="stSkip" style="color:#fff;border-color:#fff">Saltar</button><button class="btn sm pri" id="stNext">Siguiente ▶</button></div></div>
 </section>

 <section class="scr" id="red">
  <canvas id="rcv"></canvas>
  <div class="band" style="position:absolute;left:0;right:0;top:0;z-index:5"><button class="ib" id="rBack" aria-label="Volver" style="border-left:0;border-right:3px solid var(--negro)">←</button><div class="bt">La Red · Valle de Aburrá</div><div class="sp"></div><div class="tag" id="rInfo">—</div></div>
  <div class="card hide" id="rCard"></div>
  <div class="lchips" id="rChips"></div>
 </section>

 <section class="scr" id="multi">
  <div class="band"><button class="ib" id="nBack" aria-label="Volver" style="border-left:0;border-right:3px solid var(--negro)">←</button><div class="bt">Jugar juntos</div><div class="sp"></div><div class="tag" id="nStat">Sin conexión</div></div>
  <div class="scroll"><div class="wrap" id="nBody"></div></div>
 </section>
</div>
<div id="modal" hidden><div class="mbox" id="mBody"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
